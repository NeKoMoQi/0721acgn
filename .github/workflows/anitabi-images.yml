name: anitabi-images

# 把 anitabi 的点位图和封面复制到本站 OSS（服务器 IP 被 image.anitabi.cn 拦，Actions 出口可用）。
# 需要仓库 Secrets：OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET（Endpoint/Bucket 已写死在本文件）。
# 产物：OSS xunli-v2/images/<sha256>.<ext> + xunli-v2/image-map.json；服务器再用 rewrite_images.py 换库里的 URL。
on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *'   # 04:30 Asia/Shanghai
  push:
    paths:
      - '.github/workflows/anitabi-images.yml'
      - 'ops/anitabi/sync_images.py'

permissions:
  contents: write

concurrency:
  group: anitabi-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
      OSS_BUCKET: acgn0721
      OSS_PUBLIC_BASE: https://acgn0721.oss-cn-hangzhou.aliyuncs.com
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "$OSS_ACCESS_KEY_ID" ] || [ -z "$OSS_ACCESS_KEY_SECRET" ]; then
            echo "::error::缺少仓库 Secrets：OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET（Settings → Secrets and variables → Actions）"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python -m pip install --quiet requests oss2

      - name: Build export (image list)
        run: |
          python ops/anitabi/collect_dump.py --cache data/site-dump --out data/images-export
          cd data/images-export && echo "EXPORT=$(cat CURRENT)" >> "$GITHUB_ENV"

      - name: Sync images to OSS
        run: |
          python ops/anitabi/sync_images.py --export "data/images-export/$EXPORT" --threads 8 | tee sync.log
          echo "sync_exit=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Status
        run: |
          python - <<'PY'
          import json, os, re, time
          log = open('sync.log', encoding='utf-8', errors='replace').read() if os.path.exists('sync.log') else ''
          m = re.findall(r'\{"utc".*\}', log)
          status = json.loads(m[-1]) if m else {'error': 'no status line', 'log_tail': log[-1000:]}
          status.setdefault('run_url', f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          open('runs/images-status.json', 'w', encoding='utf-8').write(json.dumps(status, ensure_ascii=False, indent=2))
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p runs
          git add runs/images-status.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "chore(images): anitabi image sync $(date -u +%F)"
            git pull --rebase || true
            git push
          fi
