name: copymanga-match

# 用站内搜索把 39 部旧漫画对应到 mangacopy 的 path_word，并读取连载状态/章节数。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copymanga-match.yml'
      - 'ops/copymanga/match_comics.py'
      - 'ops/copymanga/site_comics.tsv'

permissions:
  contents: write

concurrency:
  group: copymanga-match
  cancel-in-progress: true

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install --quiet selenium beautifulsoup4 requests
      - name: Match comics
        run: python ops/copymanga/match_comics.py | tee match.log
        continue-on-error: true
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/copymanga-matches.json ops/copymanga/comics.txt
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "chore(copymanga): 匹配 39 部作品的 path_word/状态 $(date -u +%F)"
            git pull --rebase || true
            git push
          fi
