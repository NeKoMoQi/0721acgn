name: copymanga-selenium-probe

# 用无头 Chrome 渲染 mangacopy 页面，读章节页的 img[data-src]（站点图片由混淆 JS 动态加载）。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copymanga-selenium.yml'
      - 'ops/copymanga/probe_selenium.py'

permissions:
  contents: write

concurrency:
  group: copymanga-selenium
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMIC_URL: https://www.mangacopy.com/comic/HAIBIANZHIYE
      COPY_USER: ${{ secrets.COPY_USER }}
      COPY_PASS: ${{ secrets.COPY_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --quiet selenium beautifulsoup4 requests
          google-chrome --version || true
      - name: Probe with headless Chrome
        run: python ops/copymanga/probe_selenium.py
        continue-on-error: true
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/copymanga-selenium.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "chore(copymanga): selenium probe $(date -u +%F)"
            git pull --rebase || true
            git push
          fi
