name: copymanga-rank

# 每天扫描 mangacopy 排行榜（默认前 100），列表写 OSS copymanga/rank/latest.json。
on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *'   # 04:30 Asia/Shanghai
  push:
    paths:
      - '.github/workflows/copymanga-rank.yml'
      - 'ops/copymanga/scan_rank.py'

permissions:
  contents: write

concurrency:
  group: copymanga-rank
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
      OSS_BUCKET: acgn0721
      TOP_N: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install --quiet selenium beautifulsoup4 oss2
      - name: Scan rank
        run: python ops/copymanga/scan_rank.py
        continue-on-error: true
      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/copymanga-rank.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "chore(copymanga): rank scan $(date -u +%F)"
            git pull --rebase || true
            git push
          fi
