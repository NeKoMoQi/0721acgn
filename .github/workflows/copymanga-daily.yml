name: copymanga-daily

# 每日：扫排行榜 → 按 state.json 去重/别名判断 → 选最多 5 部（+ 连载中追更）→ 分批抓章节。
# 服务器端 nightly 任务负责 export_state（供本 job 读取）和 import_daily（把 manifest 入库）。
on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *'   # 04:30 Asia/Shanghai
  push:
    paths:
      - '.github/workflows/copymanga-daily.yml'
      - 'ops/copymanga/scan_rank.py'
      - 'ops/copymanga/pick_daily.py'
      - 'ops/copymanga/crawl_plan.py'

permissions:
  contents: write

concurrency:
  group: copymanga-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
      OSS_BUCKET: acgn0721
      OSS_PUBLIC_BASE: https://acgn0721.oss-cn-hangzhou.aliyuncs.com
      COPY_USER: ${{ secrets.COPY_USER }}
      COPY_PASS: ${{ secrets.COPY_PASS }}
      TOP_N: '100'
      LIMIT: ${{ github.event.inputs.limit }}
      BUDGET: ${{ github.event.inputs.budget }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install --quiet selenium beautifulsoup4 oss2 requests

      - name: Scan rank
        run: python ops/copymanga/scan_rank.py | tee rank.log
        continue-on-error: true

      - name: Pick today's works
        run: |
          LIMIT=${LIMIT:-5}
          python ops/copymanga/pick_daily.py --top "${TOP_N:-100}" --limit "$LIMIT" | tee pick.log
        continue-on-error: true

      - name: Crawl planned works (batched)
        run: |
          BUDGET=${BUDGET:-20}
          python ops/copymanga/crawl_plan.py --budget "$BUDGET" | tee crawl.log
        continue-on-error: true

      - name: Commit summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/copymanga-rank.json runs/copymanga-daily.json
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "chore(copymanga): daily $(date -u +%F)"
            git pull --rebase || true
            git push
          fi
