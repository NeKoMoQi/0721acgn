# MySQL
spring.datasource.mysql.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.mysql.jdbc-url=jdbc:mysql://localhost:3306/0721acgn
spring.datasource.mysql.username=YOUR_MYSQL_USERNAME
spring.datasource.mysql.password=YOUR_MYSQL_PASSWORD

# PostgreSQL/PostGIS
spring.datasource.postgresql.driver-class-name=org.postgresql.Driver
spring.datasource.postgresql.jdbc-url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.postgresql.username=YOUR_POSTGRES_USERNAME
spring.datasource.postgresql.password=YOUR_POSTGRES_PASSWORD
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect

# MyBatis
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.example.demo.handler

# Upload limits
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1030MB

# Aliyun OSS
aliyun.oss.endpoint=oss-cn-hangzhou.aliyuncs.com
aliyun.oss.access-key-id=YOUR_ALIYUN_OSS_ACCESS_KEY_ID
aliyun.oss.access-key-secret=YOUR_ALIYUN_OSS_ACCESS_KEY_SECRET
aliyun.oss.bucket-name=YOUR_ALIYUN_OSS_BUCKET
aliyun.oss.folder-prefix=anime-reality/

# Live2D / pilgrimage agent: direct DeepSeek API (secret stays on the server)
live2d.agent.deepseek.api-key=${DEEPSEEK_API_KEY:}
live2d.agent.deepseek.base-url=https://api.deepseek.com
live2d.agent.deepseek.model=deepseek-flash
# Optional external folder containing character.md and knowledge/ (30s reload)
live2d.agent.assets-dir=
