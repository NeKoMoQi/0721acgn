#iron-snow{--is-text:#d8d2c0;--is-muted:#adafa2;--is-accent:#c9a75a;--is-border:rgba(200,190,160,.25);--is-center:.53;position:relative;isolation:isolate;overflow:hidden;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#232823;color:var(--is-text);font:14px/1.6 'Bahnschrift','Microsoft YaHei',sans-serif}
#iron-snow *{box-sizing:border-box}#iron-snow [hidden]{display:none!important}
#iron-snow .is-art{position:absolute;inset:0;z-index:-3;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.76)}
#iron-snow .is-olive{position:absolute;inset:0;z-index:-2;background:rgba(53,64,42,.13);mix-blend-mode:color}
#iron-snow .is-shade{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 30% 75% at 50% 47%,rgba(24,30,27,var(--is-center)),rgba(24,30,27,.27) 72%,transparent 100%),linear-gradient(0deg,rgba(19,25,24,.95),rgba(24,30,27,.42) 19%,rgba(24,30,27,.09) 66%,rgba(24,30,27,.23));box-shadow:inset 0 0 55px rgba(19,25,24,.36)}
#iron-snow main{flex:1;padding:clamp(22px,6svh,80px) clamp(12px,4vw,32px);display:flex;flex-direction:column;align-items:center;justify-content:center}
#iron-snow .is-home{width:100%;max-width:560px;text-align:center}#iron-snow h1{display:inline-block;font-family:'Bahnschrift Condensed','Microsoft YaHei',sans-serif;font-weight:700;font-size:60px;line-height:1.25;letter-spacing:.22em;text-indent:.22em;transform:scaleX(.9);margin:0 0 20px;color:#d8d2c0;text-shadow:0 3px 18px rgba(15,20,18,.5)}
#iron-snow .is-brief{font:12px/1.8 'Consolas','Microsoft YaHei',monospace;letter-spacing:1px;color:#bfc0b1;margin:0 auto 30px;max-width:510px;text-shadow:0 2px 5px #232823}
#iron-snow .is-actions{display:grid;gap:12px;width:clamp(300px,26vw,420px);max-width:100%;margin:auto}
#iron-snow button{font:inherit;color:inherit;border-radius:2px}#iron-snow .is-action{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;padding:13px 19px;gap:14px;background:rgba(35,40,35,.85);border:1px solid var(--is-border);text-align:left;letter-spacing:2px;box-shadow:0 4px 12px rgba(15,20,18,.18)}
#iron-snow .is-action:hover,#iron-snow .is-action:focus-visible{border-color:var(--is-accent);background:rgba(49,56,47,.94)}#iron-snow .is-action.is-primary{color:var(--is-accent)}#iron-snow .is-action small{font-size:11px;letter-spacing:0;color:#a9ab9f}#iron-snow .is-action:disabled{color:#a6a99d;background:rgba(35,40,35,.76);border-color:rgba(200,190,160,.16);cursor:default}#iron-snow .is-arrow{font-size:19px;line-height:1}
#iron-snow .is-links{display:flex;justify-content:center;gap:26px;margin-top:18px}#iron-snow .is-link{background:transparent;border:0;color:#babdaf;font-size:12px;letter-spacing:1px;padding:5px 0;text-shadow:0 2px 5px #232823}#iron-snow .is-link:hover{color:var(--is-text)}#iron-snow .is-notice{font-size:12px;color:#b7baad;margin:12px 0 0;min-height:20px}
#iron-snow footer{position:relative;padding:15px 28px 18px;border-top:1px solid rgba(200,190,160,.16);background:rgba(28,34,31,.65);text-align:center;font:11px/1.8 'Consolas','Microsoft YaHei',monospace;letter-spacing:.5px;color:rgba(216,210,192,.65)}
#iron-snow .is-panel{width:440px;max-width:100%;padding:25px;background:rgba(35,40,35,.94);border:1px solid var(--is-border)}#iron-snow .is-panel h2{font-size:23px;letter-spacing:4px;font-weight:500;margin:8px 0 24px}#iron-snow .is-panel .is-link{padding:0;text-shadow:none}#iron-snow .is-route{margin:10px 0;border:1px solid var(--is-border);padding:13px 15px;display:flex;justify-content:space-between;gap:12px}#iron-snow .is-route b{font-weight:500;letter-spacing:2px}#iron-snow .is-route small{font-size:11px;color:var(--is-muted)}#iron-snow .is-panel p{font-size:12px;color:var(--is-muted)}#iron-snow .is-panel .is-action{margin-top:24px}#iron-snow .is-rules{padding-left:20px;font-size:13px;line-height:2.1;color:#bfc0b1}
/* One Chinese family, with weight and spacing defining the hierarchy. */
#iron-snow{--is-text:#e8e2d2;--is-muted:rgba(216,210,192,.6);font-family:'Iron Snow Sans','Noto Sans SC',sans-serif;font-synthesis:none}
#iron-snow h1{font-family:inherit;font-size:clamp(48px,5vw,92px);font-weight:900;letter-spacing:.2em;text-indent:.2em;transform:none;color:#e8e2d2;text-shadow:none}
#iron-snow .is-brief{font-family:inherit;font-size:13px;font-weight:400;line-height:1.8;letter-spacing:.3em;color:rgba(216,210,192,.6);text-shadow:none;max-width:550px;text-wrap:balance}
#iron-snow .is-action{font-family:inherit;font-size:15px;font-weight:500;letter-spacing:.1em;color:rgba(216,210,192,.75)}
#iron-snow .is-action.is-primary{color:#c9a75a}
#iron-snow .is-action:disabled{color:rgba(216,210,192,.75)}
#iron-snow .is-action small{font-family:inherit;font-size:11px;font-weight:400;letter-spacing:.05em;color:rgba(216,210,192,.5)}
#iron-snow .is-arrow{font-family:inherit;font-size:15px;font-weight:500;letter-spacing:0}
#iron-snow .is-link{font-family:inherit;font-size:12px;font-weight:400;letter-spacing:.15em;color:rgba(216,210,192,.5);text-shadow:none}
#iron-snow .is-notice{font-family:inherit;font-size:12px;font-weight:400;letter-spacing:.05em;color:rgba(216,210,192,.5)}
#iron-snow footer{font-family:inherit;font-size:12px;font-weight:400;letter-spacing:.05em;color:#c7c6b8}
#iron-snow .is-panel h2{font-family:inherit;font-weight:700;letter-spacing:.15em;color:#e8e2d2}
#iron-snow .is-route b{font-family:inherit;font-weight:500;letter-spacing:.1em}
#iron-snow .is-route small,#iron-snow .is-panel p,#iron-snow .is-rules{font-family:inherit;font-weight:400;color:rgba(216,210,192,.6);letter-spacing:.05em}
#iron-snow .is-action:disabled{background:rgba(35,40,35,.425);border-color:rgba(200,190,160,.12);color:rgba(216,210,192,.5);box-shadow:none}
#iron-snow .is-action:disabled small{color:rgba(216,210,192,.3)}
#iron-snow .is-links{gap:16px}
#iron-snow .is-link{min-height:44px;color:#e2dfd0}
#iron-snow .is-home{position:relative;isolation:isolate}
#iron-snow .is-home:before{content:'';position:absolute;z-index:-1;pointer-events:none;top:-28px;left:-18px;right:-18px;height:175px;background:linear-gradient(180deg,rgba(24,30,27,.15),rgba(24,30,27,0));mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
#iron-snow .is-route{opacity:.5}
#iron-snow .is-route b{color:rgba(216,210,192,1)}
#iron-snow .is-route small{color:rgba(216,210,192,.4)}
#iron-snow .is-panel h2{font-family:'Iron Snow Sans','Noto Sans SC',sans-serif;font-weight:900;letter-spacing:.2em}
#iron-snow .is-panel .is-campaign-note{font-size:11px;letter-spacing:.05em;color:rgba(216,210,192,.45)}
#iron-snow [data-bridge] .is-bridge-name,#iron-snow [data-bridge] .is-bridge-arrow{color:#c9a75a}
#iron-snow .is-action > span { min-width: 0; }
#iron-snow .is-action small { text-align: right; }
#iron-snow .is-panel [data-campaign] > .is-action { margin-top: 10px; }
#iron-snow .is-panel .is-link { padding-inline: 4px; }
#iron-snow .is-rules { margin-bottom: 0; }
#iron-snow .is-notice:empty { display: none; }
#iron-snow footer {
  padding: 10px 12px max(14px, env(safe-area-inset-bottom));
  background: #1c221fd9;
}
#iron-snow footer p { margin: 6px 0 0; }
#iron-snow footer p:empty { margin: 0; }
#iron-snow .save-tools { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
#iron-snow .save-tools :is(button, a) {
  display: inline-grid; place-items: center; min-height: 44px; padding: 6px 11px;
  background: #2f3630; border: 1px solid #918b6d85; border-radius: 3px; color: #e8e2d2;
  text-decoration: none;
}
#iron-snow :is(button, a):focus-visible { outline: 2px solid var(--is-accent); outline-offset: 2px; }
@media (max-width: 600px) and (orientation: portrait) {
  #iron-snow .is-art { height: clamp(160px, 29dvh, 310px); object-position: center top; }
  #iron-snow .is-shade { background: linear-gradient(180deg, #23282315, #232823 clamp(160px, 29dvh, 310px)); }
  #iron-snow main { padding-top: clamp(90px, 19dvh, 190px); }
  #iron-snow .is-brief { margin-bottom: 18px; letter-spacing: .16em; }
  #iron-snow .is-panel { padding: 16px; }
}
@media (max-height: 540px) {
  #iron-snow h1 { margin-bottom: 6px; font-size: clamp(38px, 11svh, 58px); }
  #iron-snow .is-brief, #iron-snow .is-panel h2 { margin-bottom: 12px; }
  #iron-snow .is-action { min-height: 46px; padding-block: 7px; }
  #iron-snow .is-links { margin-top: 6px; }
}
</style>
