#soviet-chapters{--gc-text:#e8e2d2;--gc-muted:rgba(216,210,192,.5);--gc-gold:#c9a75a;--gc-line:rgba(200,190,160,.18);font:14px/1.7 'Iron Snow Sans',sans-serif;font-synthesis:none;background:#252c29;color:var(--gc-text);position:relative;isolation:isolate;overflow:hidden}
#soviet-chapters *{box-sizing:border-box}#soviet-chapters [hidden]{display:none!important}#soviet-chapters button{font:inherit;color:inherit;border-radius:2px}#soviet-chapters button:focus-visible{outline:2px solid var(--gc-gold);outline-offset:3px}#soviet-chapters .gc-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.12;filter:saturate(.35);z-index:-2}#soviet-chapters .gc-wash{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#252c29ee,#252c29a0 60%,#252c29d9)}
#soviet-chapters .gc-header{display:flex;align-items:center;gap:23px;padding:18px 30px;border-bottom:1px solid var(--gc-line);background:#262d2b;padding-right:105px}#soviet-chapters .gc-back{border:0;background:transparent;color:rgba(216,210,192,.6);font-size:12px;letter-spacing:.1em;padding:5px 0}#soviet-chapters .gc-brand{border-left:1px solid var(--gc-line);padding-left:23px;font-size:18px;font-weight:900;letter-spacing:.2em}
