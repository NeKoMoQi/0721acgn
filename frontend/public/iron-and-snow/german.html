#german-chapters{--gc-text:#e8e2d2;--gc-muted:rgba(216,210,192,.5);--gc-gold:#c9a75a;--gc-line:rgba(200,190,160,.18);font:14px/1.7 'Iron Snow Sans',sans-serif;font-synthesis:none;background:#252c29;color:var(--gc-text);position:relative;isolation:isolate;overflow:hidden}
#german-chapters *{box-sizing:border-box}#german-chapters [hidden]{display:none!important}#german-chapters button{font:inherit;color:inherit;border-radius:2px}#german-chapters button:focus-visible{outline:2px solid var(--gc-gold);outline-offset:3px}#german-chapters .gc-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.12;filter:saturate(.35);z-index:-2}#german-chapters .gc-wash{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#252c29ee,#252c29a0 60%,#252c29d9)}
#german-chapters .gc-header{display:flex;align-items:center;gap:23px;padding:18px 30px;border-bottom:1px solid var(--gc-line);background:#262d2b;padding-right:105px}#german-chapters .gc-back{border:0;background:transparent;color:rgba(216,210,192,.6);font-size:12px;letter-spacing:.1em;padding:5px 0}#german-chapters .gc-brand{border-left:1px solid var(--gc-line);padding-left:23px;font-size:18px;font-weight:900;letter-spacing:.2em}
#german-chapters .gc-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:27px 30px 23px}#german-chapters h1{font-size:29px;letter-spacing:.2em;font-weight:900;margin:0 0 4px}#german-chapters .gc-sub{font-size:12px;letter-spacing:.1em;color:rgba(216,210,192,.5);margin:0}#german-chapters .gc-progress{font-size:11px;color:var(--gc-muted);white-space:nowrap}#german-chapters .gc-num{font-family:'Consolas',monospace;letter-spacing:.05em;font-variant-numeric:tabular-nums}
#german-chapters .gc-phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 30px;gap:8px}#german-chapters .gc-phase{position:relative;display:flex;gap:13px;align-items:center;min-height:74px;text-align:left;padding:13px;background:#2b322e;border:1px solid var(--gc-line);color:rgba(216,210,192,.5)}#german-chapters .gc-phase[aria-selected=true]{background:#343c33;color:var(--gc-text);border-bottom:2px solid var(--gc-gold)}#german-chapters .gc-phase:hover{border-color:rgba(201,167,90,.65)}#german-chapters .gc-phase>span{font-size:23px;color:rgba(216,210,192,.35)}#german-chapters .gc-phase[aria-selected=true]>span{color:var(--gc-gold)}#german-chapters .gc-phase b{display:block;font-weight:500;font-size:14px;letter-spacing:.1em}#german-chapters .gc-phase small{font-size:11px;color:rgba(216,210,192,.4);display:block;margin-top:3px}
#german-chapters .gc-content{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:25px;padding:27px 30px 28px}#german-chapters .gc-section-label{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:11px;color:var(--gc-muted);letter-spacing:.1em;margin-bottom:12px}#german-chapters .gc-missions{display:grid;gap:9px}#german-chapters .gc-mission{display:flex;align-items:center;gap:15px;width:100%;min-height:76px;padding:13px 16px;text-align:left;background:rgba(39,46,41,.88);border:1px solid var(--gc-line)}#german-chapters .gc-mission:hover{background:#333b32;border-color:#877a5266}#german-chapters .gc-mission[aria-pressed=true]{border-color:var(--gc-gold);background:#343b31;box-shadow:inset 3px 0 var(--gc-gold)}#german-chapters .gc-mission .gc-index{font-size:21px;color:rgba(216,210,192,.4);min-width:30px}#german-chapters .gc-mission[aria-pressed=true] .gc-index{color:var(--gc-gold)}#german-chapters .gc-mission-name{flex:1;min-width:0}#german-chapters .gc-mission b{font-size:15px;font-weight:500;letter-spacing:.1em;display:block}#german-chapters .gc-mission small{display:block;font-size:11px;color:rgba(216,210,192,.4);margin-top:3px}#german-chapters .gc-status{font-size:11px;color:rgba(216,210,192,.35);white-space:nowrap}#german-chapters .gc-mission.gc-locked b{color:rgba(216,210,192,.5)}#german-chapters .gc-mission[aria-pressed=true] b{color:var(--gc-text)}#german-chapters .gc-mission[aria-pressed=true] .gc-status{color:var(--gc-gold)}
#german-chapters .gc-dossier{min-width:0;border:1px solid var(--gc-line);background:rgba(37,44,42,.95);display:flex;flex-direction:column}#german-chapters .gc-image{position:relative;height:124px;overflow:hidden;background:#30372f}#german-chapters .gc-image img{width:100%;height:100%;object-fit:cover;object-position:50% 68%;filter:saturate(.5) brightness(.6)}#german-chapters .gc-image:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#252c2a,transparent 85%)}#german-chapters .gc-image-label{position:absolute;bottom:10px;left:23px;z-index:1;font-size:11px;letter-spacing:.15em;color:rgba(216,210,192,.55)}#german-chapters .gc-brief{padding:3px 23px 21px;display:flex;flex:1;flex-direction:column}#german-chapters .gc-file{font:11px/1.7 'Consolas','Iron Snow Sans',sans-serif;color:var(--gc-muted);letter-spacing:.1em;margin:0 0 6px}#german-chapters h2{font-size:24px;font-weight:900;letter-spacing:.12em;margin:0 0 7px}#german-chapters .gc-description{font-size:13px;color:rgba(216,210,192,.65);margin:0 0 18px;min-height:45px}#german-chapters .gc-objective{padding:13px 0;border-top:1px solid var(--gc-line);border-bottom:1px solid var(--gc-line);margin-bottom:14px}#german-chapters .gc-objective span{display:block;color:var(--gc-muted);font-size:11px;margin-bottom:5px;letter-spacing:.1em}#german-chapters .gc-objective p{font-size:14px;letter-spacing:.04em;margin:0;color:rgba(216,210,192,.85)}#german-chapters .gc-branch{color:var(--gc-gold);font-size:11px;margin:0 0 12px}#german-chapters .gc-next{font-size:11px;color:rgba(216,210,192,.45);margin:0 0 18px}#german-chapters .gc-enter{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 16px;min-height:48px;border:1px solid rgba(201,167,90,.55);background:#30382f;color:var(--gc-gold);font-size:15px;font-weight:500;letter-spacing:.1em;margin-top:auto}#german-chapters .gc-enter:hover{border-color:var(--gc-gold);background:#394134}#german-chapters .gc-enter:disabled{border-color
